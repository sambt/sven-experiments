defaults:
  - dataset: cifar10
  - model: resnet_cifar10
  - _self_

name: scan
mode: both
device: cuda
print_config: true

num_epochs: 20
batch_size: 128
loss: ce
use_gram: true
gram_capture: full              # one jacrev over all params = full (B,P) Jacobian -> Gram (batch-stat BN needs chunked/full, not hooks)
# C-E2: batch statistics for EVERY optimizer -- frozen running stats never update from init
# and collapsed Sven to ~28% acc (probe 2026-09-12). Supersedes the old
# `gram_freeze_norm_stats: false`; grid.py derives that boolean from `bn_mode` and still
# puts `_bnbatch` in the svd run_ids, so the ids are unchanged.
bn_mode: batch

# SVD optimizer sweep
k_values: [64,128]
# C-B3: the Sven optimum on THIS scan sits on the smallest lr -> extend down by two
# half-decade points. Each added point costs 2 k x 3 rtol x 5 seeds = 30 runs ~ 15 GPU-h,
# so this is the only CIFAR Sven axis that grows.
lrs: [0.02,0.05,0.1,0.5,1.0]
rtol: [1e-4,1e-3,1e-2]
svd_mode: [torch]   # irrelevant under use_gram: exact eigh of the BxB Gram, no randomized SVD
kappa: 2

# C-B3, sized from THIS scan's 290 legacy records (seed-mean final val loss), not from
# the MLP scans: RMSprop's optimum IS the old 1e-1 top edge -- 1e-4 2.1002, 1e-3 1.3324,
# 1e-2 1.3725, 1e-1 1.1983 -- so the top edge grows by two half-decade points, 3e-1 and
# 1.0. Adam (best 1e-2, 1.2156) and SGD (best 1e-3, 1.3391) are interior. Down to 1e-5
# because Muon/MuonW are NEW here and adjust_lr_fn=match_rms_adamw scales their effective
# step by up to 13.6x on the layer4 kernels (optim.fix.md (c)), i.e. their optimum moves
# DOWN. Each lr point is 8 standard optimizers x 5 seeds = 40 runs ~ 0.5 GPU-h.
# C-B3 extension round (user-approved, 2026-09-19): the added top end moved the edge rather
# than closing it -- SGD's optimum over the finished scan is lr 1.0 (1.338, `lr:EDGE-HIGH`),
# the new top point. ONE more point, not two: SGD is the only optimizer out there (SGDm
# peaks at 3e-1, RMSprop at 1e-3, everything else at 1e-2 or below), and at 3.0 a plain-SGD
# ResNet step is already at the edge of stability, so a second point would buy nothing.
lrs_standard: [1e-5,3e-5,1e-4,1e-3,1e-2,1e-1,3e-1,1.0,3.0]
# C-B1/C-B2/C-B5/O6: AdamW, SGDm, SOAP, Muon and MuonW join the CIFAR headline set. Muon
# and MuonW are legitimate on a ResNet now that the conv kernels go through the vendored
# MuonConv (flatten-to-2D, validated exact against stock Muon); the old "Muon" on ResNet18
# was AdamW plus one fc layer (F13). Shampoo/KFAC stay out (per-layer preconditioners at
# 11.18M params). No weight_decays list => AdamW 0.01, MuonW 0.1, Adam/Muon wd 0.
optimizers_standard: [Adam, AdamW, SGD, SGDm, RMSprop, Muon, MuonW, SOAP, LBFGS, PolyakSGD]
# C-B3 for the L-BFGS family, which has its own lr grid: the best SHAPE here is on the lr
# top edge too (mi2/hs5 seed-mean final val 2.2524 at lr 0.1, 1.3533 at 0.5, 1.3201 at
# 1.0), even though the mean over all nine shapes is best at 0.5 (2.2312 / 1.5430 / 1.7468)
# because the mi3 arms blow up at 1.0. ONE bracketing point, not two: lr > 1 with
# strong_wolfe over-relaxes an already-accepted step, and the mi3 blow-up says the far
# side of the plateau is right there. +45 runs (3 mi x 3 hs x 5 seeds) ~ 1.7 GPU-h.
# C-B3 extension round (user-approved, 2026-09-19): the added 2.0 IS the new optimum
# (1.014 seed-mean final val, 5/5 seeds, second only to MuonW on this scan, and
# `lr:EDGE-HIGH`), so the edge moved. ONE more point again, for the same cost reason.
lrs_lbfgs: [0.1, 0.5, 1.0, 2.0, 4.0]
lbfgs_max_iter: [1, 2, 3]
lbfgs_line_search_fn: [strong_wolfe]
lbfgs_history_size: [2, 5, 10]

# PARKED, NOT BUDGETED: the jd and hig grids below enumerate 20 + 80 runs that no
# launcher has ever submitted on a ResNet and that campaign/grid_counts.md excludes from
# the campaign total (HIG here needs a full per-sample Jacobian, ~50 GPU-h for the 80).
# They are kept so `p3_cifar_jd_hig` in campaign/plan_campaign.yaml (all items
# `enabled: false`, awaiting a user decision) can be revived by one flag. Consequence:
# `mode=all` on this config claims 100 unbudgeted runs -- launch it as mode=svd /
# mode=standard, which is what the plan does.
# Jacobian Descent (torchjd) hyperparameters
aggregators_jd: [UPGrad]
inner_optimizers_jd: [Adam]
lrs_jd: [1e-4, 1e-3, 1e-2, 1e-1]

# Half-Inverse Gradients hyperparameters
lrs_hig: [0.05, 0.1, 0.5, 1.0]
tau_hig: [1e-8, 1e-6, 1e-4, 1e-2]

loader_seed: 4000
model_seeds: [4000, 4001, 4002, 4003, 4004]
