defaults:
  - dataset: cifar10
  - model: resnet_cifar10
  - _self_

name: scan
mode: both
device: cuda
print_config: true

num_epochs: 10
batch_size: 128
loss: ce

# SVD optimizer sweep
k_values: [32,64,128]
lrs: 0.1
rtol: 1e-3
svd_mode: randomized_v2
kappa: 2

lrs_standard: 1e-3
optimizers_standard: [Adam, RMSprop, SGD, PolyakSGD]

loader_seed: 51159
model_seeds: [47612]
