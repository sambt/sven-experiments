# Rebuttal: Sven vs the FULL modern baseline suite on random polynomial (full data).
# Direct answer to Reviewer 1 (AdamW/K-FAC/Shampoo/SOAP) and Reviewer 2 (Muon).
defaults:
  - dataset: random_polynomial
  - model: mlp_polynomial
  - _self_

name: scan
mode: both
device: cuda
print_config: true

degree: 4
input_dim: 6

num_epochs: 20
batch_size: 32
mlp_width: 16
result_id_fields: [mlp_width]
loss: mse

k_values: [1, 2, 4, 8, 16, 32]
lrs: [0.05, 0.1, 0.5, 1.0]
rtol: [1e-4, 1e-3, 1e-2]
svd_mode: [torch]
use_rmsprop: false
use_gram: true  # exact Gram-trick backend (added rebuttal fresh re-run 2026-08-31)
variable_k: false

lrs_standard: [1e-4, 1e-3, 1e-2, 1e-1]
optimizers_standard: [Adam, AdamW, SGD, RMSprop, Muon, SOAP, Shampoo, KFAC, LBFGS, PolyakSGD]
weight_decays: [0.0, 0.01]
lrs_lbfgs: [0.1, 0.5, 1.0]
lbfgs_max_iter: [4, 10]
lbfgs_line_search_fn: [strong_wolfe]
lbfgs_history_size: [10]

loader_seed: 51159
model_seeds: [4372892, 1, 2, 3, 4, 5, 6, 7, 8, 9]
data_seed: 54631
