defaults:
  - dataset: random_polynomial
  - model: mlp_polynomial
  - _self_

name: scan
mode: both
device: cuda
print_config: true

num_epochs: 20
batch_size: 32
mlp_width: 16
input_dim: 6
degree: 4
result_id_fields: [mlp_width]
loss: mse
use_gram: true

k_values: [1,2,4,8,16,32]
lrs: [0.05, 0.1, 0.5, 1.0]
rtol: [1e-4, 1e-3, 1e-2]
svd_mode: [torch]
variable_k: false

lrs_standard: [1e-4, 1e-3, 1e-2, 1e-1]
#optimizers_standard: [Adam, AdamW, SGD, RMSprop, LBFGS, PolyakSGD, Lion, Muon, ScheduleFreeAdamW, ScheduleFreeSGD]
# Consolidated: this scan now includes the full modern baseline suite (the extra
# optimizers formerly in rebuttal_baselines_*). NOTE the results dir also holds the
# earlier CORE-only runs, which used a different loader seed / LBFGS grid, so the
# directory documents all runs rather than being a single reproducible Cartesian grid.
optimizers_standard: [Adam, AdamW, SGD, RMSprop, Muon, SOAP, Shampoo, KFAC, LBFGS, PolyakSGD]
lrs_lbfgs: [0.1, 0.5, 1.0]
lbfgs_max_iter: [1,2,5,10]
lbfgs_line_search_fn: [strong_wolfe]
lbfgs_history_size: [1,2,5,10]

loader_seed: 2000
model_seeds: [2000, 2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009]
data_seed: 2000
