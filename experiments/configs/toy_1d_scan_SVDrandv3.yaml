defaults:
  - dataset: toy_1d_regression
  - model: mlp_1d_regression
  - _self_

name: scan
mode: svd
device: cuda
print_config: true

num_epochs: 20
batch_size: 32
mlp_width: 16
result_id_fields: [mlp_width]
loss: mse

k_values: [1,2,4,8,16,32]
lrs: [0.05, 0.1, 0.5, 1.0]
rtol: [1e-4, 1e-3, 1e-2]
svd_mode: [randomized_v3]
kappa: 2

lrs_standard: [1e-4, 1e-3, 1e-2, 1e-1]
optimizers_standard: [Adam, SGD, PolyakSGD, RMSprop, LBFGS]
lrs_lbfgs: [0.1, 0.5, 1.0]
lbfgs_max_iter: [1,2,5,10]
lbfgs_line_search_fn: [strong_wolfe]
lbfgs_history_size: [1,2,5,10]

# Jacobian Descent (torchjd) hyperparameters
aggregators_jd: [UPGrad]
inner_optimizers_jd: [Adam]
lrs_jd: [1e-4, 1e-3, 1e-2, 1e-1]

# Half-Inverse Gradients hyperparameters
lrs_hig: [0.05, 0.1, 0.5, 1.0]
tau_hig: [1e-8, 1e-6, 1e-4, 1e-2]

loader_seed: 51159
model_seeds: [4310, 4311, 4312, 4313, 4314, 4315, 4316, 4317, 4318, 4319]
data_seed: 54631