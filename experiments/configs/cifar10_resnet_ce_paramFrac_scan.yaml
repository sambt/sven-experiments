defaults:
  - dataset: cifar10
  - model: resnet_cifar10
  - _self_

name: scan
mode: svd
device: cuda
print_config: true

num_epochs: 20
batch_size: 128
loss: ce
use_gram: true
gram_capture: full              # one jacrev over all params = full (B,P) Jacobian -> Gram (batch-stat BN needs chunked/full, not hooks)
gram_freeze_norm_stats: false    # frozen running stats never update from init -> Sven collapsed to ~28% acc (probe 2026-09-12)

k_values: 128    # BN-fixed CE headline best (scan_analysis best_sven 2026-09-17): k=128, lr=0.1, rtol=1e-2 (val 1.415, 53% acc)
lrs: 0.1
rtol: 1e-2
svd_mode: [torch]   # irrelevant under use_gram: exact eigh of the BxB Gram, no randomized SVD
param_fractions: [0.05, 0.1, 0.25, 0.5, 0.75, 1.0]

loader_seed: 4000
model_seeds: [4000]
