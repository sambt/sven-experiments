defaults:
  - dataset: mnist
  - model: mlp_mnist
  - _self_

name: scan
mode: svd
device: cuda
print_config: true

num_epochs: 20
batch_size: 64
mlp_width: 32
result_id_fields: [mlp_width]
loss: label_regression
use_gram: true

k_values: 64
lrs: 0.5
rtol: 1e-4
svd_mode: [torch]
kappa: [1, 1.5, 2, 2.5, 3]

loader_seed: 3000
model_seeds: [3000, 3001, 3002, 3003, 3004, 3005, 3006, 3007, 3008, 3009]
