defaults:
  - dataset: toy_1d_regression
  - model: mlp_1d_regression
  - _self_

name: scan
mode: svd
device: cuda
print_config: true

num_epochs: 20
batch_size: 32
mlp_width: 16
result_id_fields: [mlp_width]
loss: mse
use_gram: true

# Sven-only ablation on a <1k-param MLP: `log` (steps 0,1,2,4,... + every epoch end) is
# ~0.5 MB/run, so the offline-spectra ladder is free here.
checkpoints: log
# Param fraction sweep: Jacobian columns from ~593 to frac*593
param_fractions: [0.1, 0.25, 0.5, 0.75, 1.0]

k_values: [32]
lrs: [0.05, 0.1, 0.5, 1.0]
rtol: [1e-3]
svd_mode: [torch]

loader_seed: 1000
model_seeds: [1000, 1001, 1002, 1003, 1004]
data_seed: 1000
