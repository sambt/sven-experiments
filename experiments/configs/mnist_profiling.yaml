defaults:
  - dataset: mnist
  - model: mlp_mnist
  - _self_

name: scan
mode: both
device: cuda
print_config: true

num_epochs: 5
batch_size: 64
mlp_width: 32
result_id_fields: [mlp_width]
loss: label_regression

k_values: [1,2,4,8,16,32]
lrs: 0.1
rtol: 1e-4
svd_mode: [torch, randomized, randomized_v2]
kappa: 2

lrs_standard: 1e-3
optimizers_standard: [Adam, SGD, PolyakSGD, RMSprop, LBFGS]
lrs_lbfgs: 0.1
lbfgs_max_iter: [1,2,5,10]
lbfgs_line_search_fn: [strong_wolfe]
lbfgs_history_size: [1,2,5,10]

# Jacobian Descent (torchjd) hyperparameters
aggregators_jd: [UPGrad]
inner_optimizers_jd: [Adam]
lrs_jd: [1e-3]

# Half-Inverse Gradients hyperparameters
lrs_hig: [0.1]
tau_hig: [1e-8]

loader_seed: 51159
model_seeds: [6310]
data_seed: 54631

profile:
  num_steps: 5
  warmup_steps: 2
  detailed: false
  output_dir: profile_results