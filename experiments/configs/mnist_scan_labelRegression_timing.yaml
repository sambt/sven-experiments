# Standalone-timing companion of mnist_scan_labelRegression: identical settings/seeds (inherited
# below), but each job runs ONE (optimizer, best-setting) pair alone on a GPU
# (NPROC=1) so wall times are not inflated by shard contention. Results land in
# experiment_results/mnist_scan_labelRegression_timing/ with the SAME run_ids as the scan, so
# analysis.scan_analysis.attach_standalone_times can join them onto scan rows.
defaults:
  - mnist_scan_labelRegression
  - _self_
