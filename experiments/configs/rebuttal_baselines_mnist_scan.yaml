# Rebuttal: Sven vs the FULL modern baseline suite on MNIST (full data, label regression).
# Matches the main-paper Fig 1 MNIST setup (width-32 MLP, B=64, label-regression loss)
# with the expanded baseline suite. Reviewer 1 (AdamW/K-FAC/Shampoo/SOAP), Reviewer 2 (Muon).
#
# NOTE: MNIST is the heaviest of the three; start with 5 seeds and extend to 10 if time allows.
defaults:
  - dataset: mnist
  - model: mlp_mnist
  - _self_

name: scan
mode: both
device: cuda
print_config: true

num_epochs: 20
batch_size: 64
mlp_width: 32
result_id_fields: [mlp_width]
loss: label_regression

k_values: [16, 32, 48, 64]
lrs: [0.1, 0.5, 1.0]
rtol: [1e-3, 1e-2]
svd_mode: [torch]
use_rmsprop: false
alpha_rmsProp: 0.99
variable_k: false
use_gram: true            # Gram-trick backend: exact same update, ~400x faster

lrs_standard: [1e-4, 1e-3, 1e-2, 1e-1]
optimizers_standard: [Adam, AdamW, SGD, RMSprop, Muon, SOAP, Shampoo, KFAC, LBFGS, PolyakSGD]
weight_decays: [0.0, 0.01]
lrs_lbfgs: [0.1, 0.5, 1.0]
lbfgs_max_iter: [4, 10]
lbfgs_line_search_fn: [strong_wolfe]
lbfgs_history_size: [10]

loader_seed: 51159
model_seeds: [3000, 3001, 3002, 3003, 3004]
