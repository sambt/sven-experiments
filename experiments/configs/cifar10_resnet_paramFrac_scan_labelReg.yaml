defaults:
  - dataset: cifar10
  - model: resnet_cifar10
  - _self_

name: scan
mode: svd
device: cuda
print_config: true

num_epochs: 20
batch_size: 128
loss: label_regression
use_gram: true
gram_capture: hooks

k_values: 128
lrs: 0.1
rtol: 1e-4
svd_mode: [randomized_v2]
param_fractions: [0.05, 0.1, 0.25, 0.5, 1.0]

loader_seed: 4000
model_seeds: [4000]
