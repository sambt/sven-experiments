# Memory / step-time profile for nanogpt (see experiments/optimizer_profile.py). Inherits the
# dataset, model, loss and seeds of `exp_nanogpt_speedrun`; the scan grids in it are ignored here.
#   PYTHONPATH=. python -m experiments.optimizer_profile --config-name profile_nanogpt
defaults:
  - exp_nanogpt_speedrun
  - _self_

arch: nanogpt
profile:
  warmup_steps: 10
  num_steps: 50
  min_steps: 10          # always measure at least this many steps ...
  max_seconds: 120       # ... but stop early once this much measured time has elapsed
  max_warmup_seconds: 120
  staged_batches: 8      # batches held on the GPU and cycled (data loading stays untimed)
  output_dir: profile_results_v2
base: {batch_size: 64, k_fraction: 1.0, lr: 0.1, rtol: 1e-3}   # k = number of rows; lr/rtol do not affect cost
# Masking under hooks capture is not implemented for transformers, so the
# parameter-fraction study uses the jacrev-based variants only.
baselines: [Adam, AdamW, SGD, RMSprop, Muon, SOAP, Shampoo, KFAC, PolyakSGD, LBFGS1, LBFGS3, JD, HIG]
sven_variants: [gram_hooks, gram_full, gram_chunked, classic]
studies:
  methods: {}
  batch_size: {values: [8, 16, 32, 64, 128], methods: [gram_hooks, gram_full, classic, AdamW, SGD]}
  chunk_fraction: {values: [1.0, 0.5, 0.25, 0.125, 0.0625]}
  param_fraction: {values: [0.05, 0.1, 0.25, 0.5], mask_modes: [elementwise, tensor], variants: [gram_full, classic]}
  microbatch: {values: [1, 2, 4, 8, 16], variants: [gram_hooks, gram_full, classic]}
  k: {values: [0.125, 0.25, 0.5, 1.0], variants: [gram_hooks, gram_full, classic]}
