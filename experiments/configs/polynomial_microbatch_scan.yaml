defaults:
  - dataset: random_polynomial
  - model: mlp_polynomial
  - _self_

name: scan
mode: svd
device: cuda
print_config: true

num_epochs: 20
batch_size: 32
mlp_width: 16
input_dim: 6
degree: 4
result_id_fields: [mlp_width]
loss: mse
use_gram: true

# Sven-only ablation on a <1k-param MLP: `log` (steps 0,1,2,4,... + every epoch end) is
# ~0.5 MB/run, so the offline-spectra ladder is free here.
checkpoints: log
# Microbatch sweep: effective Jacobian rows = 32/mb
microbatch_sizes: [1, 2, 4, 8, 16, 32]

k_values: [32]
lrs: [0.05, 0.1, 0.5, 1.0]
rtol: [1e-3]   # headline scan 2026-09-12: 1e-3 ~ 1e-4 best, 1e-2 20% worse
svd_mode: [torch]

loader_seed: 2000
model_seeds: [2000, 2001, 2002, 2003, 2004]
data_seed: 2000
