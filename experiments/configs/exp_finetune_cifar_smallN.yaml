# Fine-tune an ImageNet-pretrained ResNet18 (~11M params) on a SMALL CIFAR-10
# subset -> genuine dataset-overparam (P >> N), Sven's theoretical sweet spot and
# the honest answer to R1. n_train swept via the launcher. Report test accuracy +
# parameter norm (min-norm/generalization story).
defaults:
  - dataset: cifar10_finetune
  - model: resnet18_pretrained
  - _self_

name: scan
mode: both
device: cuda
print_config: true

# P >> N sweep: subsample the CIFAR training set. Override n_data on the command
# line to trace P/N (P = 11.18M). result_id_fields puts n_data in the run_id so
# different subset sizes don't collide in the shared output dir.
n_data: 500
dataset:
  n_train: ${n_data}
  subsample_seed: ${data_seed}
result_id_fields: [n_data]

num_epochs: 30
batch_size: 64
loss: label_regression

use_gram: true
gram_capture: hooks          # pretrained BN is _NormBase -> frozen-stats hooks (validated)
track_param_norm: true       # min-norm claim
# C-E2 / O2: FROZEN pretrained statistics, in train and eval, for EVERY optimizer -- not
# just for the Sven wrappers. That is the whole point of a fine-tuning study at P >> N: the
# ImageNet running statistics are part of the pretrained model, and letting the baselines
# re-estimate them from 250-2000 images while Sven cannot would be an unfair comparison.
bn_mode: frozen

k_values: [64]
lrs: [0.01, 0.05, 0.1, 0.5]
rtol: [1e-3]
svd_mode: [torch]

# SGDm added (C-B2). No weight_decays list => AdamW 0.01, MuonW 0.1, Muon wd 0.
optimizers_standard: [AdamW, SGD, SGDm, Muon, MuonW]
# C-B3: Muon/MuonW on resnet18_pretrained silently changed from "AdamW + fc" to the
# conv-flat MuonConv variant, and adjust_lr_fn=match_rms_adamw scales the effective step by
# up to 13.6x on the layer4 kernels (optim.fix.md (c)), so the shared list needs two
# half-decades of headroom below the old 1e-4 edge.
lrs_standard: [1e-5, 3e-5, 1e-4, 1e-3, 1e-2, 1e-1]

loader_seed: 7000
model_seeds: [7000, 7001, 7002]
data_seed: 7000
