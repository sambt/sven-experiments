defaults:
  - dataset: cifar10
  - model: resnet_cifar10
  - _self_

name: scan
mode: both
device: cuda
print_config: true

num_epochs: 1
batch_size: 64
loss: ce

# SVD optimizer sweep
k_values: [16,32,64]
lrs: [0.1,0.5,1.0]
rtol: [1e-3,1e-2]
svd_mode: [randomized_v2]

lrs_standard: [1e-3,1e-2]
optimizers_standard: [Adam, RMSprop, SGD, PolyakSGD]

loader_seed: 51159
model_seeds: [47612]
