defaults:
  - dataset: toy_1d_regression
  - model: mlp_1d_regression
  - _self_

name: scan
mode: all
device: cuda
print_config: true

num_epochs: 5
batch_size: 32
mlp_width: 16
result_id_fields: [mlp_width]
loss: mse

k_values: [1,2,4,8,16,32]
lrs: 0.05
rtol: 1e-3
svd_mode: [torch, randomized, randomized_v2]
kappa: 2

lrs_standard: 1e-3
optimizers_standard: [Adam, SGD, PolyakSGD, RMSprop, LBFGS]
lrs_lbfgs: 0.1
lbfgs_max_iter: 3
lbfgs_line_search_fn: [strong_wolfe]
lbfgs_history_size: 1

# Jacobian Descent (torchjd) hyperparameters
aggregators_jd: [UPGrad]
inner_optimizers_jd: [Adam]
lrs_jd: 1e-3

# Half-Inverse Gradients hyperparameters
lrs_hig: 0.05
tau_hig: 1e-6

loader_seed: 51159
model_seeds: [4310]
data_seed: 54631

profile:
  num_steps: 5
  warmup_steps: 2
  detailed: false
  output_dir: profile_results