defaults:
  - dataset: mnist
  - model: mlp_mnist
  - _self_

name: scan
mode: both
device: cuda
print_config: true

batch_size: 64
mlp_width: 32        # scalar default used by ${mlp_width} interpolation
mlp_widths: [32, 64, 128, 256, 512, 1024]   # sweep list consumed by the profiler
result_id_fields: [mlp_width]
loss: ce

k_values: [1, 2, 4, 8, 16, 32, 64]
lrs: 0.1
rtol: 1e-3
svd_mode: [torch, randomized, randomized_v2]
kappa: 2

lrs_standard: 1e-3
optimizers_standard: [Adam, SGD, RMSprop, LBFGS, PolyakSGD]
lrs_lbfgs: 0.1
lbfgs_max_iter: 5
lbfgs_line_search_fn: strong_wolfe
lbfgs_history_size: 10

loader_seed: 51159
model_seeds: [6310]

profile:
  num_steps: 5
  warmup_steps: 2
  detailed: false
  output_dir: profile_results
