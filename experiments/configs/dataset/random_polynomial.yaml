# All monomials of total degree <= degree (210 for degree 4 in 6 variables), constant and
# linear included, factors MULTIPLIED, coefficient = N(0,1)/sqrt(E[m(x)^2]) (C-D1).
# Fixed training pool of 10,000 plus val/test from separate generators (C-D3).
# The pre-2026-09 generator lives on as experiments.datasets.AdditiveCubicDataset.
_target_: experiments.datasets.RandomPolynomialDataset
degree: ${degree}
num_vars: ${input_dim}
seed: ${data_seed}    # coefficient draw + the three generator seeds; recorded as split_seed
n_train: 10000        # subsamples the pool
n_val: 10000
n_test: 10000
pool_size: 10000
