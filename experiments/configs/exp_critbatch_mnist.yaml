# Cheap critical-batch companion on the MNIST MLP (fast; validates the B-sweep).
defaults:
  - dataset: mnist
  - model: mlp_mnist
  - _self_

name: scan
mode: both
device: cuda
print_config: true

num_epochs: 20
mlp_width: 32
batch_size: [8, 16, 32, 64, 128, 256, 512]
loss: label_regression

use_gram: true
gram_capture: hooks

k_fractions: [0.5]
lrs: [0.1, 0.5, 1.0]
rtol: [1e-3]
svd_mode: [torch]

optimizers_standard: [AdamW]
lrs_standard: [1e-3, 1e-2, 1e-1]

loader_seed: 3000
model_seeds: [3000, 3001]
