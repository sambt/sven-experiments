defaults:
  - dataset: mnist
  - model: mlp_mnist
  - _self_

name: scan
mode: svd
device: auto
print_config: true

num_epochs: 20
batch_size: 64
mlp_width: 32
result_id_fields: [mlp_width]
loss: ce

# The JAX port differentiates only the active slice — the Jacobian really is
# (B, frac*P) in both memory and compute, so this scan is meaningfully cheaper
# at small param_fractions.
param_fractions: [0.1, 0.25, 0.5, 0.75, 1.0]

k_values: [8, 16, 32, 64]
lrs: [1.0, 10.0, 50.0]
rtol: [1e-2]
svd_mode: [randomized]
use_rmsprop: true
alpha_rmsProp: 0.99

loader_seed: 51159
model_seeds: [47612, 1, 2]
