# Gate-1 check (j), the hard way: TWO jobs starting together on ONE work list, into a
# root where nothing is finished yet, so they really race for every run.
#
# In the main smoke matrix the two lanes shared four items but their record-writing
# windows barely overlapped (+0.2 s on toy_1d_scan, and the A100 job arrived after the
# MIG job had finished the MNIST ones), so "two concurrent jobs executed each run exactly
# once" rested on the concurrency INSIDE a job (4 MIG pools x NPROC claimers). This plan
# removes the doubt: two identical jobs, the same items, a fresh results root.
#
#   tools/launch_campaign.py campaign/plan_smoke_race.yaml --snapshot <snap> --submit --time 00:20:00
#
# Pass = 18 runs, 18 records, 18 done markers, one jsonl line each, `claims/` and
# `started/` empty, `attempts/` empty, nothing under `_stale/`.
version: 1
plan: smoke_race
results_root: /n/holystore01/LABS/iaifi_lab/Users/sambt/sv3_campaign_scratch/smoke_race_74987054

lanes:
  a100:
    partition: "iaifi_gpu_priority,iaifi_gpu,gpu"
    gres: "gpu:1"
    mem: 64G
    time: "00:20:00"
    cpus_extra: 2
  # gpu_test starts in seconds, which is what makes the two jobs certain to overlap: on
  # the A100 lane the second job sat in (Resources) while the first drained the list.
  mig:
    partition: gpu_test
    gres: "gpu:2"
    cpus: 16
    mem: 64G
    time: "00:20:00"
    max_jobs: 2

work_lists:
  - name: smoke_race
    phase: P0
    lane: a100
    n_jobs: 2                  # the point of this plan
    note: "two jobs, one list, one empty root: every run must be executed exactly once"
    items:
      - {config: toy_1d_scan, nproc: 6,
         overrides: "mode=svd num_epochs=2 model_seeds=[1000,1001] k_values=[8,32] lrs=[0.5,1000.0] rtol=[1e-3]"}
      - {config: mnist_scan_ce, nproc: 6,
         overrides: "mode=svd num_epochs=2 model_seeds=[3000] k_values=[32,64] lrs=[0.5] rtol=[1e-3]"}
      - {config: mnist_scan_ce, nproc: 6,
         overrides: "mode=standard optimizers_standard=[Adam,AdamW,SGDm,Muon,MuonW,PolyakSGD] num_epochs=2 model_seeds=[3000] lrs_standard=[0.001]"}
      - {config: mnist_scan_labelRegression, nproc: 6,
         overrides: "mode=svd num_epochs=2 model_seeds=[3000] k_values=[32,64] lrs=[0.5] rtol=[1e-3]"}

  # the same four items again, on the lane where two jobs really do start together
  - name: smoke_race_mig
    phase: P1
    lane: mig
    n_jobs: 2
    note: "two gpu_test jobs x 2 slices x NPROC 3, launched together into a second empty root"
    items:
      - {config: toy_1d_scan, nproc: 3,
         overrides: "mode=svd num_epochs=2 model_seeds=[1000,1001] k_values=[8,32] lrs=[0.5,1000.0] rtol=[1e-3]"}
      - {config: mnist_scan_ce, nproc: 3,
         overrides: "mode=svd num_epochs=2 model_seeds=[3000] k_values=[32,64] lrs=[0.5] rtol=[1e-3]"}
      - {config: mnist_scan_ce, nproc: 3,
         overrides: "mode=standard optimizers_standard=[Adam,AdamW,SGDm,Muon,MuonW,PolyakSGD] num_epochs=2 model_seeds=[3000] lrs_standard=[0.001]"}
      - {config: mnist_scan_labelRegression, nproc: 3,
         overrides: "mode=svd num_epochs=2 model_seeds=[3000] k_values=[32,64] lrs=[0.5] rtol=[1e-3]"}
