    - {config: mnist_paramfrac_ce_scan,         overrides: *O_SVD, nproc: *np_sven_mlp}

# ---------------------------------------------------------------------------
# The work lists
# ---------------------------------------------------------------------------
work_lists:
  # ---------------- P0: the six headline scans + nanoGPT ----------------
  # The gpu_test lane admits only 2 jobs per user, so "queue everything at once, headline first"
  # (user, 2026-09-18) is ONE ordered list for that lane: P0 items, then P1, then P3. Launch it by
  # name (`--list all_mlp_mig`); the per-phase mig lists below stay for targeted resubmits.
  # 2026-09-19: MNIST HIG costs ~2.25 h per run at NPROC 6 on a MIG slice (SVD of a 640 x 27,562 Jacobian per step),
  # i.e. ~14 h of the whole MIG lane for the two scans, and it sat in front of the P1 overparam scans (R1 crux).
  # v2 = everything still open, reordered: P1, then P3, then the two MNIST HIG items last.
  - name: all_mlp_mig_v2
    phase: P9
    lane: mig
    n_jobs: 2
    note: "remaining MLP work after the first 12 h: P1 -> P3 -> MNIST HIG last"
    items:
      - *items_p1_mlp
      - *items_p3_mlp
      - {config: mnist_scan_labelRegression,  overrides: *O_HIG,    nproc: {a100: 4, mig: 4}}
      - {config: mnist_scan_ce,               overrides: *O_HIG,    nproc: {a100: 4, mig: 4}}

  - name: all_mlp_mig
    phase: P9                 # spans P0+P1+P3: select it with `--list all_mlp_mig`, never by phase
    lane: mig
    n_jobs: 2
    note: "all MLP work in priority order on the 8 MIG slices; resubmit the same command every 12 h until reconcile is clean"
    items: [*items_p0_mlp, *items_p1_mlp, *items_p3_mlp]

  - name: p0_mlp_mig
    phase: P0
    lane: mig
    n_jobs: 2                 # the gpu_test cap: 2 jobs x 4 slices = the 8-GPU TRES cap
    # `chain: true` is a note to the operator: this list is long-lived enough to be worth
    # `--chain`, which submits ONE self-renewing job instead of n_jobs. The renewal
    # happens BEFORE the 12 h wall (the pool starts no item within 15 min of
    # $SLURM_JOB_END_TIME and the job traps `--signal=B:USR1@900`), and it needs a free
    # slot at that moment because MaxSubmit=2 counts this still-running job -- so the
    # launcher keeps one of the two slots free whenever a chain is in the selection.
    # Two plain jobs (n_jobs: 2) use the lane fully but stop at 12 h; one chain keeps
    # going unattended. Do not mix: two chains cannot renew at all.
    chain: true
    note: "toy/poly/MNIST headline MLP work on MIG slices; 0 s queue wait, ~0.5-0.8x an A100 per slice"
    items: *items_p0_mlp

  - name: p0_mlp_a100_overflow
    phase: P0
    lane: a100
    n_jobs: 4
    note: "same items at A100 NPROC; absorbs whatever the 8 MIG slices have not finished"
    items: *items_p0_mlp

  - name: p0_cifar_sven
    phase: P0
    lane: a100
    n_jobs: 4
    note: "CIFAR Sven: NPROC=1 (probe T=0.98 at 2 co-tenants), several identical jobs instead;
           full capture + empty_cache=false + expandable_segments = 186.7 ms/step, 23.3 GB"
    items:
      - {config: cifar10_resnet_scan_labelRegression, overrides: *O_SVD, nproc: *np_cifar_sven}
      - {config: cifar10_resnet_ce_scan,              overrides: *O_SVD, nproc: *np_cifar_sven}

  - name: p0_cifar_baselines
    phase: P0
    lane: a100
    n_jobs: 2
    note: "ResNet18 baselines; AdamW/Muon/MuonW have never run on CIFAR (needs the config
           to list them -- the dry run warns until it does)"
    items:
      - {config: cifar10_resnet_scan_labelRegression, overrides: *O_CIFAR_FIRST, nproc: *np_cifar_first}
      - {config: cifar10_resnet_ce_scan,              overrides: *O_CIFAR_FIRST, nproc: *np_cifar_first}
      - {config: cifar10_resnet_scan_labelRegression, overrides: *O_LBFGS,       nproc: *np_cifar_heavy}
      - {config: cifar10_resnet_ce_scan,              overrides: *O_LBFGS,       nproc: *np_cifar_heavy}
      - {config: cifar10_resnet_scan_labelRegression, overrides: *O_CIFAR_MUON,  nproc: *np_cifar_first}
      - {config: cifar10_resnet_ce_scan,              overrides: *O_CIFAR_MUON,  nproc: *np_cifar_first}
      # SOAP is the only second-order baseline the CIFAR configs list; NPROC 2 is
      # inferred (its preconditioner state is unmeasured on an 11 M-param ResNet)
      - {config: cifar10_resnet_scan_labelRegression, overrides: *O_CIFAR_SECOND, nproc: *np_cifar_heavy}
      - {config: cifar10_resnet_ce_scan,              overrides: *O_CIFAR_SECOND, nproc: *np_cifar_heavy}

  - name: p0_nanogpt
    phase: P0
    lane: a100
    n_jobs: 2
    note: "R1 'no transformers'; ~4 GPU-h total. nanoGPT Sven NPROC=3 (probe), MIG is 1 -> A100 only"
    items:
      - {config: exp_nanogpt_speedrun, overrides: *O_SVD,          nproc: *np_nanogpt}
      - {config: exp_nanogpt_speedrun, overrides: *O_NANOGPT_STD,  nproc: *np_nanogpt}

  # ---------------- P1: the rebuttal cruxes ----------------
  - name: p1_mlp_mig
    phase: P1
    lane: mig
    n_jobs: 2
    chain: true               # with --chain: ONE self-renewing job (see p0_mlp_mig)
    note: "overparam P>N (R1 crux) + batch-size sweep (R2 Q1); one item per n_data"
    items: *items_p1_mlp

  - name: p1_mlp_a100_overflow
    phase: P1
    lane: a100
    n_jobs: 4
    note: "same items at A100 NPROC"
    items: *items_p1_mlp

  - name: p1_cifar_fig5
    phase: P1
    lane: a100
    n_jobs: 2
    note: "Fig-5 param-fraction, 3 seeds (user: necessary; replaces the two 1-seed CIFAR
           paramFrac scans). Its k/lr/rtol set point must be re-derived from the reconciled
           headline scan BEFORE launch (grid_inventory.md §5.5)"
    items:
      - {config: rebuttal_fig5_cifar_paramfrac_scan, overrides: *O_SVD, nproc: *np_cifar_sven}

  # ---------------- P2: one grid-extension round ----------------
  - name: p2_extension_round
    phase: P2
    lane: a100
    n_jobs: 2
    note: "STUB, intentionally empty. Fill it from `tools/reconcile.py <scan>`: every
           method whose best config sits on a grid EDGE gets one half-decade extension
           item (`lrs=[...]`, and for Sven `k_values`/`rtol`), per C-B3, at most one
           round. Enable the items, then launch this list."
    items: []

  # The one extension round that was actually taken (ANALYSIS_PLAN.md section 7.5, user
  # decision 2026-09-20). It is a SEPARATE LIST, not an edit of cifar10_resnet_ce_scan.yaml,
  # on purpose: the config's own grid (and therefore `campaign/grid_counts.md`, every golden
  # count and `tools/reconcile.py`'s expected grid) stays exactly as the campaign ran it,
  # and this item adds 45 runs OFF that grid instead of moving it.
  - name: p2_cifar_ce_rtol
    phase: P2
    lane: a100
    n_jobs: 5
    note: "CIFAR-CE Sven rtol extension, restricted version. The selected Sven config on this
           scan sits on the rtol HIGH edge (1e-2) while MNIST-CE prefers 0.1-0.3, so rtol gets
           three more half-decade points -- but only around the selected lr, not over the whole
           grid: 1 k x 3 lr x 3 rtol x 5 seeds = 45 runs at ~0.45 h = ~20 GPU-h (the full
           2 k x 5 lr x 3 rtol version would be 150 runs / ~70 GPU-h). NPROC 1 because CIFAR
           Sven full capture is 23.3 GB and the probe measured T=0.98 at two co-tenants;
           5 jobs x ~9 runs each is ~4-5 h of wall clock.
           OFF-GRID BY DESIGN: `rtol` 0.03/0.1/0.3 are not in the config's `rtol` list, so
           these 45 run_ids are outside `expand_grid(cifar10_resnet_ce_scan, mode=all)`.
           tests/test_tools_launch.OFF_GRID_ITEMS carries the exemption (and asserts that the
           item really is off-grid). Consequences, both deliberate:
             * `tools/reconcile.py cifar10_resnet_ce_scan` counts these records as
               `n_off_grid_records` and its best-config table ignores them;
             * so does `tools/select_best.py` unless the extension is named as a second
               expected grid (union of the two groups = the expected grid).
           RE-SELECTION after this list finishes. THE OBVIOUS COMMAND IS DESTRUCTIVE: read
           this first. The selection command is
             `tools/select_best.py cifar10_resnet_ce_scan --groups 'mode=all' --groups
             'mode=svd k_values=[128] lrs=[0.05,0.1,0.5] rtol=[0.03,0.1,0.3]'`
           and it MUST carry either `--print` (step 1: look, writes nothing) or
           `--out /tmp/ce_rtol.json` (step 2: record to a SIDE file, then splice that file's
           `scans.cifar10_resnet_ce_scan` -- and only that one key -- into
           bench/best_configs.json). With NEITHER flag it overwrites the selection of record:
           `--out` defaults to bench/best_configs.json and select_best writes
           `to_json(reports)` for the REQUESTED scans only, with no merge
           (tools/select_best.py:742-746), so naming one scan deletes the other six scans'
           selections -- the ones tools/gen_phase5_plan.py (DEFAULT_IN) and the headline
           analysis read. The file is git-tracked, so `git checkout -- bench/best_configs.json`
           undoes a clobber. Re-running all seven scans is not a fix either: `--groups` is
           GLOBAL (one tuple passed to every scan, tools/select_best.py:716), so this CIFAR
           group would add ~135 phantom expected run_ids to each of the other six, inflating
           `n_missing` and breaking `--require-complete`. See ANALYSIS_PLAN.md section 7.5."
    items:
      - {config: cifar10_resnet_ce_scan, nproc: *np_cifar_sven,
         overrides: "mode=svd k_values=[128] lrs=[0.05,0.1,0.5] rtol=[0.03,0.1,0.3]",
         note: "k=128 and these three lrs bracket the selected config; rtol is a truncation
                threshold relative to sigma_max (`keep = sigma > rtol * sigma_max`, sven.py
                SvenGram.step), so even rtol=0.3 always keeps the leading singular value and
                cannot raise on its own -- the `no singular value above rtol * sigma_max`
                RuntimeError needs a zero/non-finite Gram, which is a divergence and is
                recorded as one."}

  # ---------------- P3: ablations, fine-tune, diagnostics ----------------
  - name: p3_mlp_mig
    phase: P3
    lane: mig
    n_jobs: 2
    chain: true               # with --chain: ONE self-renewing job (see p0_mlp_mig)
    note: "kappa retune + micro-batch / param-fraction MLP sweeps"
    items: *items_p3_mlp

  - name: p3_mlp_a100_overflow
    phase: P3
    lane: a100
    n_jobs: 2
    note: "same items at A100 NPROC"
    items: *items_p3_mlp

  - name: p3_finetune
    phase: P3
    lane: a100
    n_jobs: 2
    note: "OUT OF THE LAUNCH PLAN (user, 2026-09-18 ~21:30): exp_finetune_cifar_smallN moves
           to the EXTENSION phase, after the campaign. The items stay here, complete and
           parked, so the extension is one `enabled: true` away. (R2 Q3, pretrained ResNet18
           on small N, bn_mode=frozen everywhere per O2; the 240 legacy records of this scan
           are F3-contaminated, so it must run in the fresh root.)"
    items:
      - {config: exp_finetune_cifar_smallN, overrides: "mode=svd n_data=250",  nproc: *np_resnet_ft, enabled: false}
      - {config: exp_finetune_cifar_smallN, overrides: "mode=svd n_data=500",  nproc: *np_resnet_ft, enabled: false}
      - {config: exp_finetune_cifar_smallN, overrides: "mode=svd n_data=1000", nproc: *np_resnet_ft, enabled: false}
      - {config: exp_finetune_cifar_smallN, overrides: "mode=svd n_data=2000", nproc: *np_resnet_ft, enabled: false}
      - {config: exp_finetune_cifar_smallN, overrides: "mode=standard n_data=250",  nproc: *np_cifar_first, enabled: false}
      - {config: exp_finetune_cifar_smallN, overrides: "mode=standard n_data=500",  nproc: *np_cifar_first, enabled: false}
      - {config: exp_finetune_cifar_smallN, overrides: "mode=standard n_data=1000", nproc: *np_cifar_first, enabled: false}
      - {config: exp_finetune_cifar_smallN, overrides: "mode=standard n_data=2000", nproc: *np_cifar_first, enabled: false}

  - name: p3_cifar_jd_hig
    phase: P3
    lane: a100
    n_jobs: 1
    note: "PARKED, needs a user decision. Both CIFAR headline configs carry lrs_jd and
           lrs_hig (20 JD + 80 HIG runs each) and NO launcher has ever run them; HIG on
           ResNet18 needs a full per-sample Jacobian, i.e. Sven-class cost (~25-30 min a
           run => ~50 GPU-h per scan). Enable only if the reviewers' JD/HIG comparison is
           wanted on CIFAR as well as on the four MLP scans."
    items:
      - {config: cifar10_resnet_scan_labelRegression, overrides: *O_JD,  nproc: *np_cifar_heavy, enabled: false}
      - {config: cifar10_resnet_ce_scan,              overrides: *O_JD,  nproc: *np_cifar_heavy, enabled: false}
      - {config: cifar10_resnet_scan_labelRegression, overrides: *O_HIG, nproc: *np_cifar_sven,  enabled: false}
      - {config: cifar10_resnet_ce_scan,              overrides: *O_HIG, nproc: *np_cifar_sven,  enabled: false}

  - name: p3_diagnostics_confirmation
    phase: P3
    lane: a100
    n_jobs: 2
    note: "STUB, intentionally empty. Diagnostics = the reconciled best config per (scan,
           method) re-run with `checkpoints=log` and dense spectra; confirmation seeds =
           the same configs at extra model_seeds. Both need best_configs.json re-derived
           from the fresh scans, so the items cannot be written before P0/P1 reconcile.
           Polynomial data-seed replicates belong here too, but `data_seed` is NOT part of
           the run_id: two data seeds would collide on the same run_id unless `data_seed`
           joins `result_id_fields` or the replicate gets its own config. DECISION NEEDED."
    items: []

# ---------------------------------------------------------------------------
# Standalone timing (C-T1 / phase 5) -- deliberately NOT part of this plan
# ---------------------------------------------------------------------------
timing:
  status: not_in_this_plan
  why: >
    Timing runs must be the only process on their GPU and must run serially: the probe
    measured that an MLP step time is set by HOST CPU load (identical MNIST-Adam config:
    1.13 ms on a quiet node vs 4.58 ms on a node at 4/4 GPUs), so any worker pool -- even
    on other GPUs of the same node -- corrupts the numbers. A claim queue is the wrong
    tool: there is no throughput to win, only isolation to protect.
  shape: >
    One `--exclusive --gres=gpu:4` job per batch of (scan, method) best-config pairs,
    NPROC=1, serial, ~36 h, launched with bench/timing_serial.sbatch (RESELECT=1 to
    re-derive best_configs.json first). Note that an exclusive job consumes one of the two
    node slots of its QOS and cannot start while any co-tenant holds a GPU on the node --
    the 2026-09-17 `timing_serial_RERUNS` job sat in QOSMaxNodePerUserLimit for 13 h.
  depends_on:
    - P0/P1 reconciled and best_configs.json re-derived from the FRESH results root
      (`tools/reconcile.py <scan>` prints the per-method best config the selection needs)
  scans: [toy_1d_scan_timing, polynomial_scan_timing, mnist_scan_labelRegression_timing,
          mnist_scan_ce_timing, exp_nanogpt_speedrun_timing,
          cifar10_resnet_ce_scan_timing, cifar10_resnet_scan_labelRegression_timing]
  note: >
    All seven companions now exist (the configs track added the two CIFAR ones). Each
    inherits its parent and overrides nothing, so it describes the parent's FULL grid under
    the parent's run_ids in its own results directory: a timing pass is a launcher
    SELECTION of the per-method best configs (~13 methods x 5 seeds per scan), never a run
    of the whole timing config. That selection is why these are not work items here.
