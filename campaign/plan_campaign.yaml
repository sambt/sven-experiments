# The robustness campaign, as work the launcher can submit.
#
#   tools/launch_campaign.py campaign/plan_campaign.yaml --phase P0            # print
#   tools/launch_campaign.py campaign/plan_campaign.yaml --phase P0 --lane mig --submit
#   tools/reconcile.py --all campaign/plan_campaign.yaml --phase P0
#
# Scope and launch order are CONTRACTS.md "Scope update" (user, 2026-09-18 evening):
# P0 = six headline scans + exp_nanogpt_speedrun; P1 = overparam (P>N), Fig-5 CIFAR
# param-fraction, batch-size polynomial; P2 = one grid-extension round (+ standalone
# timing, which is NOT in this plan -- see the `timing:` stub at the bottom);
# P3 = kappa retune, micro-batch / param-fraction MLP scans, fine-tune, diagnostics
# and confirmation seeds. CUT scans (critbatch, GPT-2-small, the four 1-seed CIFAR
# kappa/paramFrac scans, mnist_scan_brier) do not appear here at all.
#
# Every list is a PRIORITY ORDER, not an assignment: the runner takes work from the
# claim queue (`scheduler=claims`), so every GPU of every job may work the same item
# concurrently and an item whose runs are all finished returns in seconds. Adding
# jobs to a lane therefore never duplicates work -- it only adds throughput.
#
# ONE SNAPSHOT PER LIST. The MLP work is launched twice (the MIG lane and its A100
# overflow list run the SAME items), and those are two invocations of the launcher. Both
# must use the SAME deploy snapshot: `grid.run_hash` covers the resolved dataset, model,
# num_epochs, loss and the eval settings, so two snapshots whose configs differ in any of
# them give every run of the scan a different hash8 -- and the C-R3 rule then has each
# lane move the other's finished results to `_stale/` and re-run them. The launcher
# stamps the snapshot into the items file and refuses a list that is live from another
# one, but after a re-deploy the right move is to let the old jobs finish (or cancel
# them) before launching the second lane from the new snapshot.
#
# `campaign/grid_counts.md` is the ground truth for how many runs each scan describes;
# `tests/test_tools_launch.py` asserts that the enabled items of this plan cover exactly
# those numbers, family by family, so a config edit cannot silently leave work unlaunched.
#
# NPROC values are the measured GPU probe table (campaign/stage0_reports/gpu.probe.md,
# CONTRACTS.md "Stage 1 contracts"): A100 -- MLP Sven 12, first-order MLP 12,
# LBFGS/HIG/Shampoo 4, nanoGPT 3, CIFAR Sven 1, CIFAR baselines 4; MIG slice -- MLP
# Sven 6, first-order 6, LBFGS 6, nanoGPT 1. Values NOT in the probe table are marked
# `# inferred` where they appear.
version: 1
plan: campaign
results_root: /n/holystore01/LABS/iaifi_lab/Users/sambt/sven_experiments

lanes:
  # 8 A100-80GB per QOS pair in practice (2 distinct nodes per QOS, independent caps);
  # `gpu` is opportunistic overflow only (campaign/scout/queue.md).
  a100:
    partition: "iaifi_gpu_priority,iaifi_gpu,gpu"
    gres: "gpu:1"
    mem: 64G
    time: "24:00:00"
    cpus_extra: 2          # cpus-per-task = max NPROC over the list's items + 2
    note: "one GPU per job, many jobs; 24 h default (the 12 h in the old launchers was self-imposed)"
  # gpu_test: MIG a100_3g.20gb (19.6 GB), median queue wait 3 s, but MaxJobsPU=2 AND
  # MaxSubmitPU=2 and gres/gpu=8 per user -> exactly 2 jobs x 4 slices.
  mig:
    partition: gpu_test
    gres: "gpu:4"
    cpus: 32
    mem: 128G
    time: "12:00:00"
    max_jobs: 2
    note: "MLP work only: 20 GB/slice fits toy/poly/MNIST MLPs; CIFAR full capture (23 GB) does not"

# ---------------------------------------------------------------------------
# Anchors. Keys starting with `_` are ignored by the parser.
# ---------------------------------------------------------------------------
_nproc:
  sven_mlp:    &np_sven_mlp    {a100: 12, mig: 6}
  first_mlp:   &np_first_mlp   {a100: 12, mig: 6}
  heavy_mlp:   &np_heavy_mlp   {a100: 4,  mig: 6}   # LBFGS / SOAP+Shampoo+KFAC; JD inferred
  nanogpt:     &np_nanogpt     {a100: 3,  mig: 1}
  cifar_sven:  &np_cifar_sven  {a100: 1,  mig: 1}   # T=0.98 at 2 co-tenants: 1 is optimal
  cifar_first: &np_cifar_first {a100: 4,  mig: 1}
  cifar_heavy: &np_cifar_heavy {a100: 2,  mig: 1}   # inferred: CIFAR LBFGS is unmeasured
  resnet_ft:   &np_resnet_ft   {a100: 1,  mig: 1}   # inferred: pretrained-ResNet18 Sven, hooks capture

_overrides:
  # `optimizers_standard` must stay a SUBSET of the config's own list -- the launcher's
  # dry run warns when it is not (`[warn] not in config`). PolyakSGD rides along in
  # FIRST: it is its own family in the grid but a cheap first-order step in practice.
  svd:     &O_SVD     "mode=svd"
  first:   &O_FIRST   "mode=standard optimizers_standard=[Adam,AdamW,SGD,SGDm,RMSprop,Muon,MuonW,PolyakSGD]"
  second:  &O_SECOND  "mode=standard optimizers_standard=[SOAP,Shampoo,KFAC]"
  lbfgs:   &O_LBFGS   "mode=standard optimizers_standard=[LBFGS]"
  jd:      &O_JD      "mode=jd"
  hig:     &O_HIG     "mode=hig"
  # CIFAR: the config lists Adam/SGD/SGDm/RMSprop/PolyakSGD/LBFGS today. AdamW (C-B4:
  # torch-default wd in every scan) and Muon/MuonW (O6, now that MuonConv is vendored
  # and exact) have NEVER run on ResNet18 and get their own item, because optim.fix.md
  # (c) expects their lr grid to need extending downwards.
  cifar_first:  &O_CIFAR_FIRST  "mode=standard optimizers_standard=[Adam,SGD,SGDm,RMSprop,PolyakSGD]"
  cifar_muon:   &O_CIFAR_MUON   "mode=standard optimizers_standard=[AdamW,Muon,MuonW]"
  cifar_second: &O_CIFAR_SECOND "mode=standard optimizers_standard=[SOAP]"
  nanogpt_std:  &O_NANOGPT_STD  "mode=standard optimizers_standard=[AdamW,Muon,MuonW,SOAP]"

# P0 MLP work: identical items for the MIG lane and its A100 overflow list, with the
# lane picking the NPROC. Sven for all four scans first (the headline claim), then the
# first-order baselines, then second-order/LBFGS, then JD/HIG (400 runs that NO launcher
# has ever submitted -- grid_inventory.md §5.1).
_items:
  p0_mlp: &items_p0_mlp
    - {config: toy_1d_scan,                 overrides: *O_SVD,    nproc: *np_sven_mlp}
    - {config: polynomial_scan,             overrides: *O_SVD,    nproc: *np_sven_mlp}
    - {config: mnist_scan_labelRegression,  overrides: *O_SVD,    nproc: *np_sven_mlp}
    - {config: mnist_scan_ce,               overrides: *O_SVD,    nproc: *np_sven_mlp}
    - {config: toy_1d_scan,                 overrides: *O_FIRST,  nproc: *np_first_mlp}
    - {config: polynomial_scan,             overrides: *O_FIRST,  nproc: *np_first_mlp}
    - {config: mnist_scan_labelRegression,  overrides: *O_FIRST,  nproc: *np_first_mlp}
    # MNIST-CE lost AdamW/Muon/MuonW/SOAP/Shampoo/KFAC in submit_fresh_suite.sh:79
    # (CORE_FIRST, no SECOND job). Both items below are what puts them back.
    - {config: mnist_scan_ce,               overrides: *O_FIRST,  nproc: *np_first_mlp}
    - {config: toy_1d_scan,                 overrides: *O_SECOND, nproc: *np_heavy_mlp}
    - {config: polynomial_scan,             overrides: *O_SECOND, nproc: *np_heavy_mlp}
    - {config: mnist_scan_labelRegression,  overrides: *O_SECOND, nproc: *np_heavy_mlp}
    - {config: mnist_scan_ce,               overrides: *O_SECOND, nproc: *np_heavy_mlp}
    - {config: toy_1d_scan,                 overrides: *O_LBFGS,  nproc: *np_heavy_mlp}
    - {config: polynomial_scan,             overrides: *O_LBFGS,  nproc: *np_heavy_mlp}
    - {config: mnist_scan_labelRegression,  overrides: *O_LBFGS,  nproc: *np_heavy_mlp}
    - {config: mnist_scan_ce,               overrides: *O_LBFGS,  nproc: *np_heavy_mlp}
    - {config: toy_1d_scan,                 overrides: *O_JD,     nproc: *np_heavy_mlp}
    - {config: polynomial_scan,             overrides: *O_JD,     nproc: *np_heavy_mlp}
    - {config: mnist_scan_labelRegression,  overrides: *O_JD,     nproc: *np_heavy_mlp}
    - {config: mnist_scan_ce,               overrides: *O_JD,     nproc: *np_heavy_mlp}
    - {config: toy_1d_scan,                 overrides: *O_HIG,    nproc: *np_heavy_mlp}
    - {config: polynomial_scan,             overrides: *O_HIG,    nproc: *np_heavy_mlp}
    - {config: mnist_scan_labelRegression,  overrides: *O_HIG,    nproc: *np_heavy_mlp}
    - {config: mnist_scan_ce,               overrides: *O_HIG,    nproc: *np_heavy_mlp}

  # P1 MLP work. `n_data` is an item axis (one item per value), because it changes the
